        function loadMateri() {
            const params = new URLSearchParams(window.location.search);
            const bab = parseInt(params.get('bab')) || 1;
            const materi = materiData[bab];

            if (!materi) {
                document.getElementById('materi-content').innerHTML = '<h2>Materi tidak ditemukan</h2><p><a href="materi.html">Kembali ke daftar materi</a></p>';
                return;
            }

            document.title = `${materi.title} - WEB-FIS`;

            document.getElementById('materi-content').innerHTML = `
                <div class="materi-header">
                    <h1>${materi.title}</h1>
                    <div class="meta">
                        <span>📖 ${materi.readTime} baca</span>
                        <span>📊 Level: ${materi.level}</span>
                        <span>📖 Bab ${bab} dari 8</span>
                    </div>
                </div>
                <div class="materi-body">
                    ${materi.content}
                </div>
            `;

            // Navigation
            const nav = document.getElementById('materi-nav');
            let navHTML = '';
            if (bab > 1) {
                const prev = materiData[bab - 1];
                navHTML += `<a href="detail-materi.html?bab=${bab - 1}">← ${prev.title}</a>`;
            } else {
                navHTML += `<a href="materi.html">← Daftar Materi</a>`;
            }
            if (bab < 8) {
                const next = materiData[bab + 1];
                navHTML += `<a href="detail-materi.html?bab=${bab + 1}">${next.title} →</a>`;
            } else {
                navHTML += `<a href="quiz.html">Mulai Kuis →</a>`;
            }
            nav.innerHTML = navHTML;

            // Kirim progress ke server jika sudah login
            try {
                const user = JSON.parse(localStorage.getItem('WEB-FIS_user'));
                if (user && user.id) {
                    fetch('/api/progress/access', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ studentId: user.id, bab })
                    }).then(() => console.log(`Progress bab ${bab} tersimpan`));
                }
            } catch(e) {}
        }

        loadMateri();
    </script>
