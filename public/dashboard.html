<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WEB-FIS</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== HERO ===== */
        .dashboard-hero {
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
            color: white;
            padding: 2.5rem 2rem;
            position: relative;
            overflow: hidden;
        }
        .dashboard-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            animation: float 6s ease-in-out infinite;
        }
        .dashboard-hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            animation: float 8s ease-in-out infinite reverse;
        }
        .hero-content { position: relative; z-index: 1; }
        .hero-greeting {
            font-size: 1rem;
            opacity: 0.85;
            margin-bottom: 0.25rem;
        }
        .hero-name {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
            animation: slideInLeft 0.6s ease;
        }
        .hero-nim { opacity: 0.7; font-size: 0.9rem; }
        .hero-sub { opacity: 0.6; font-size: 0.85rem; margin-top: 0.5rem; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes countUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ===== STAT CARDS ===== */
        .dash-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: -1.5rem auto 0;
            max-width: 900px;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }
        .dash-stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
        }
        .dash-stat-card:nth-child(1) { animation-delay: 0.1s; }
        .dash-stat-card:nth-child(2) { animation-delay: 0.2s; }
        .dash-stat-card:nth-child(3) { animation-delay: 0.3s; }
        .dash-stat-card:nth-child(4) { animation-delay: 0.4s; }
        .dash-stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        }
        .dash-stat-card .stat-icon {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        .dash-stat-card .num {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            transition: all 0.3s ease;
        }
        .dash-stat-card .lbl {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        /* ===== QUICK ACTIONS ===== */
        .quick-actions {
            max-width: 900px;
            margin: 2rem auto 0;
            padding: 0 2rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 0.5s ease 0.4s forwards;
        }
        .quick-action {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 10px 18px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .quick-action:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .quick-action .qa-icon { font-size: 1.1rem; }

        /* ===== SECTIONS ===== */
        .dash-section {
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeInUp 0.5s ease 0.5s forwards;
        }
        .dash-section:nth-child(odd) { animation-delay: 0.5s; }
        .dash-section:nth-child(even) { animation-delay: 0.6s; }
        .dash-section h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }
        .progress-header .label { font-weight: 600; }
        .progress-header .percent { color: var(--primary); font-weight: 700; }
        .progress-track {
            background: #e2e8f0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 5px;
            background: linear-gradient(90deg, var(--primary), #7c3aed);
            transition: width 1s ease;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        /* ===== MATERI GRID ===== */
        .materi-progress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
        }
        .materi-progress-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: scaleIn 0.3s ease forwards;
        }
        .materi-progress-item:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37,99,235,0.12);
        }
        .materi-progress-item .icon {
            width: 38px; height: 38px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .materi-progress-item:hover .icon { transform: scale(1.1); }
        .materi-progress-item .icon.done {
            background: #d1fae5; color: #059669;
            box-shadow: 0 2px 8px rgba(16,185,129,0.2);
        }
        .materi-progress-item .icon.todo { background: #f1f5f9; color: #94a3b8; }
        .materi-progress-item .info { font-size: 0.85rem; font-weight: 600; line-height: 1.3; }
        .materi-progress-item .materi-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .materi-progress-item .materi-badge.done { background: #d1fae5; color: #059669; }
        .materi-progress-item .materi-badge.todo { background: #f1f5f9; color: #94a3b8; }

        /* ===== QUIZ HISTORY ===== */
        .quiz-history-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .quiz-history-table th, .quiz-history-table td {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
        }
        .quiz-history-table th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .quiz-history-table tr { transition: background 0.2s; }
        .quiz-history-table tbody tr:hover { background: #f8fafc; }
        .score-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            display: inline-block;
            transition: transform 0.2s;
        }
        .score-badge:hover { transform: scale(1.1); }
        .score-badge.good { background: #d1fae5; color: #059669; }
        .score-badge.mid { background: #fef3c7; color: #d97706; }
        .score-badge.low { background: #fee2e2; color: #991b1b; }

        /* ===== NO DATA ===== */
        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 2.5rem;
            font-size: 0.95rem;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 2px dashed var(--border);
        }
        .no-data .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }
        .no-data a { color: var(--primary); font-weight: 600; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 80px;
            right: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--success);
            border-radius: 10px;
            padding: 14px 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .toast.show { transform: translateX(0); }
        .toast .toast-icon { font-size: 1.2rem; }

        /* ===== BTN LOGOUT ===== */
        .btn-logout {
            background: none; border: 1px solid rgba(255,255,255,0.4);
            color: white; padding: 8px 16px; border-radius: 8px;
            cursor: pointer; font-size: 0.85rem; font-weight: 600;
            transition: all 0.3s ease; position: relative; z-index: 2;
        }
        .btn-logout:hover {
            background: rgba(255,255,255,0.15);
            border-color: white;
            transform: translateY(-1px);
        }

        /* ===== SKELETON LOADING ===== */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }
        .skeleton-card {
            height: 80px;
            border-radius: 10px;
            margin-bottom: 0.75rem;
        }
        .skeleton-text {
            height: 14px;
            margin-bottom: 0.5rem;
            width: 60%;
        }
        .skeleton-text.short { width: 40%; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .hero-name { font-size: 1.4rem; }
            .dashboard-hero { padding: 1.5rem 1rem; overflow: hidden; }
            .dashboard-hero::before, .dashboard-hero::after { display: none; }
            .btn-logout { width: 100%; margin-top: 0.5rem; text-align: center; }
            .dash-stats { grid-template-columns: 1fr 1fr; margin-top: -1rem; padding: 0 1rem; }
            .dash-stat-card { padding: 1rem; }
            .dash-stat-card .num { font-size: 1.5rem; }
            .quick-actions { padding: 0 1rem; }
            .quick-actions { flex-direction: column; }
            .quick-action { justify-content: center; }
            .dash-section { padding: 1rem; }
            .materi-progress-grid { grid-template-columns: 1fr; }
            .quiz-history-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .quiz-history-table { min-width: 500px; }
            .quiz-history-table th, .quiz-history-table td { padding: 8px 10px; font-size: 0.8rem; }
            .toast { right: 1rem; left: 1rem; }
        }
        @media (max-width: 480px) {
            .dash-stats { grid-template-columns: 1fr; gap: 0.75rem; }
            .dash-stat-card .stat-icon { font-size: 1.4rem; }
            .dash-stat-card .num { font-size: 1.3rem; }
            .dash-stat-card .lbl { font-size: 0.8rem; }
            .hero-name { font-size: 1.2rem; }
            .hero-greeting { font-size: 0.85rem; }
            .hero-nim { font-size: 0.8rem; }
            .dash-section h2 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="dashboard.html" class="logo"><span>E</span> WEB-FIS</a>
            <ul class="nav-links">
                <li><a href="materi.html">Materi</a></li>
                <li><a href="quiz.html">Kuis</a></li>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
            </ul>
            <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
        </div>

    <div class="dashboard-hero">
        <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; position:relative; z-index:2;">
            <div class="hero-content">
                <p class="hero-greeting" id="greeting"></p>
                <h1 class="hero-name" id="user-name"></h1>

    <div class="quick-actions">
        <a href="materi.html" class="quick-action"><span class="qa-icon">📖</span> Mulai Belajar</a>
        <a href="quiz.html" class="quick-action"><span class="qa-icon">✏️</span> Kerjakan Kuis</a>
        <a href="tentang.html" class="quick-action"><span class="qa-icon">ℹ️</span> Tentang</a>
    </div>

    <div class="dash-section">
        <h2>📚 Progress Materi</h2>
        <div class="progress-bar-container" id="progress-container" style="display:none;">
            <div class="progress-header">
                <span class="label">Total Progress</span>
                <span class="percent" id="progress-percent">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
        </div>
        <div class="materi-progress-grid" id="materi-grid">
            <div class="skeleton skeleton-card"></div>

            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>

    <div class="dash-section">

    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 WEB-FIS. Dibuat untuk Skripsi.</p>
            <a href="tentang.html">Tentang Kami</a>

    <div class="toast" id="toast">
        <span class="toast-icon" id="toast-icon">✓</span>

    </div>

    <button class="back-to-top" aria-label="Kembali ke atas">↑</button>
    <script src="js/main.js"></script>
    <script>
        const materiNames = [
            "Pengenalan Web Development",
            "HTML - Struktur Halaman Web",
            "CSS - Mempercantik Tampilan",
            "JavaScript - Interaksi Pengguna",
            "Responsive Design",
            "Git & Version Control",
            "Intro Backend Development",
            "Deploy Website"
        ];

        function logout() {
            localStorage.removeItem('WEB-FIS_user');
            window.location.href = 'index.html';
        }

        function getGreeting() {
            const h = new Date().getHours();
            if (h < 11) return { text: 'Selamat Pagi', icon: '🌅' };
            if (h < 15) return { text: 'Selamat Siang', icon: '☀️' };
            if (h < 18) return { text: 'Selamat Sore', icon: '🌇' };
            return { text: 'Selamat Malam', icon: '🌙' };
        }

        function showToast(text, icon) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = text;
            document.getElementById('toast-icon').textContent = icon || '✓';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function animateNumber(el, target, suffix) {
            suffix = suffix || '';
            let current = 0;
            const step = Math.max(1, Math.ceil(target / 20));
            const interval = setInterval(() => {
                current += step;
                if (current >= target) {
                    current = target;
                    clearInterval(interval);
                }
                el.textContent = current + suffix;
            }, 40);
        }

        async function loadDashboard() {
            const user = JSON.parse(localStorage.getItem('WEB-FIS_user'));
            if (!user || user.role === 'admin') {
                window.location.href = 'index.html';
                return;
            }

            // Greeting
            const g = getGreeting();
            document.getElementById('greeting').textContent = `${g.icon} ${g.text},`;
            document.getElementById('user-name').textContent = user.name;
            document.getElementById('user-nim').textContent = user.nim;

            // Load progress
            let accessed = [];
            try {
                const progressRes = await fetch(`/api/progress/${user.id}`);
                const progress = await progressRes.json();
                accessed = progress.materiAccessed || [];

                // Animate stat
                animateNumber(document.getElementById('stat-materi').closest('.dash-stat-card').querySelector('.num'), accessed.length, '/8');

                // Progress bar
                const pct = Math.round((accessed.length / 8) * 100);
                if (accessed.length > 0) {
                    document.getElementById('progress-container').style.display = 'block';
                    document.getElementById('progress-percent').textContent = pct + '%';
                    setTimeout(() => {
                        document.getElementById('progress-fill').style.width = pct + '%';
                    }, 300);
                }

                // Materi grid
                const grid = document.getElementById('materi-grid');
                grid.innerHTML = materiNames.map((name, i) => {
                    const bab = i + 1;
                    const done = accessed.includes(bab);
                    return `
                        <a href="detail-materi.html?bab=${bab}" class="materi-progress-item" style="animation-delay: ${(i * 0.08)}s">
                            <div class="icon ${done ? 'done' : 'todo'}">${done ? '✓' : bab}</div>
                            <div class="info">${name}</div>
                            <span class="materi-badge ${done ? 'done' : 'todo'}">${done ? 'Selesai' : 'Belum'}</span>
                        </a>
                    `;
                }).join('');

                // Last access info
                if (progress.lastAccess) {
                    const d = new Date(progress.lastAccess);
                    const dateStr = d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
                    const timeStr = d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
                    document.getElementById('last-access').textContent = `Terakhir belajar: ${dateStr}, ${timeStr}`;
                }

            } catch (err) {
                console.error('Gagal load progress:', err);
                document.getElementById('materi-grid').innerHTML = '<div class="no-data">Gagal memuat data</div>';
            }

            // Load quiz history
            try {
                const quizRes = await fetch(`/api/quiz/${user.id}`);
                const results = await quizRes.json();

                // Animate stat
                animateNumber(document.getElementById('stat-quiz').closest('.dash-stat-card').querySelector('.num'), results.length);

                if (results.length > 0) {
                    const avg = Math.round(results.reduce((s, r) => s + r.percentage, 0) / results.length);
                    animateNumber(document.getElementById('stat-avg').closest('.dash-stat-card').querySelector('.num'), avg, '%');

                    // Toast motivasi
                    if (avg >= 80) showToast('Skor rata-rata kamu luar biasa! 🎉', '🏆');
                    else if (avg >= 60) showToast('Progress bagus! Terus semangat belajar!', '💪');
                    else showToast('Ayo tingkatkan skor kamu! Semangat!', '📚');
                }

                const historyDiv = document.getElementById('quiz-history');
                if (results.length === 0) {
                    historyDiv.innerHTML = `
                        <div class="no-data">
                            <span class="empty-icon">📝</span>
                            Belum ada riwayat kuis.<br>
                            <a href="quiz.html" style="margin-top:0.5rem; display:inline-block;">Mulai kuis sekarang! →</a>
                        </div>
                    `;
                    return;
                }

                historyDiv.innerHTML = `
                    <div class="quiz-history-wrap" style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
                    <table class="quiz-history-table">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Tanggal</th>
                                <th>Skor</th>
                                <th>Nilai</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${results.map((r, i) => {
                                const date = new Date(r.submittedAt).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
                                const cls = r.percentage >= 80 ? 'good' : r.percentage >= 60 ? 'mid' : 'low';
                                return `<tr style="animation: fadeInUp 0.3s ease ${i * 0.05}s forwards; opacity:0;">
                                    <td>${i + 1}</td>
                                    <td>${date}</td>
                                    <td>${r.score}/${r.total}</td>
                                    <td><span class="score-badge ${cls}">${r.percentage}%</span></td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                    </div>
                `;
            } catch (err) {
                console.error('Gagal load kuis:', err);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
